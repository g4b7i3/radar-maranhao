# Abre todo dia as plataformas de inscrição que só funcionam com JavaScript
# (e os calendários Road Runners e running.life, que a sessão do Claude não abre)
# e salva o que encontrar em coleta/. A pesquisa diária do Claude lê esses arquivos.
name: Coletar plataformas de inscrição

on:
  schedule:
    - cron: "37 9-23/2 * * *"   # de 2 em 2 horas, das 6h37 às 20h37 em São Luís (minuto "quebrado": o GitHub pula menos)
  workflow_dispatch:
    inputs:
      fonte:
        description: "Só uma fonte (cronoesportes, sacrono, centraldacorrida, topchip, guardalugar, roadrunners, runninglife, oficiais). Vazio = todas."
        required: false

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-24.04 # fixo: o ubuntu-latest virou Ubuntu 26 (out/2026) e o Playwright ainda não instala nele
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar navegador
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.56.1 pdfjs-dist@4.10.38
          npx playwright install --with-deps chromium
      - name: Coletar
        run: node scripts/coletar-plataformas.mjs ${{ github.event.inputs.fonte }}
      - name: Sugestões enviadas pelo site ("Enviar uma corrida")
        run: |
          curl -sf --max-time 30 https://radarcorridasma.com.br/api/sugestoes -o /tmp/sugestoes.json \
            && node -e "JSON.parse(require('fs').readFileSync('/tmp/sugestoes.json','utf8'))" \
            && cp /tmp/sugestoes.json coleta/sugestoes.json || echo "Sugestões ficaram para a próxima."
      - name: Radar Pro guarda as provas da agenda (para o "Eu corri!" depois que saem da agenda)
        run: curl -sf --max-time 30 https://xsijphfxcorjsuxiewch.supabase.co/functions/v1/radar-provas -o /dev/null || echo "Arquivo de provas fica para a próxima."
      - name: Atualizar a agenda com a coleta (sem Claude)
        run: |
          # aplica status e provas novas; se algo der errado, a agenda fica como estava
          node scripts/aplicar-coleta.mjs && node scripts/validar.mjs || git checkout -- public/data/radar.json
      - name: Clima típico das cidades novas (média de 5 anos)
        run: node scripts/clima-tipico.mjs || echo "Clima típico ficou para a próxima."
      - name: Salvar no repositório
        run: |
          git config user.name "radar-coleta[bot]"
          git config user.email "radar-coleta@users.noreply.github.com"
          git add coleta/ public/data/
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          if git diff --cached --quiet -- public/data/radar.json; then MSG="Coleta automática das plataformas"; else MSG="Agenda atualizada pela coleta automática"; fi
          git commit -m "$MSG ($(TZ=America/Fortaleza date +%d/%m\ %Hh%M))"
          git pull --rebase origin main && git push
