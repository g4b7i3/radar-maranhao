# Uso pontual: baixa um arquivo público que a sessão do Claude não alcança e salva em coleta/.
name: Baixar arquivo
on:
  workflow_dispatch:
    inputs:
      url: { description: 'Endereço', required: true }
      nome: { description: 'Nome do arquivo em coleta/', required: true }
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: curl -sSL --max-time 120 -o "coleta/${{ inputs.nome }}" "${{ inputs.url }}" && ls -la "coleta/${{ inputs.nome }}"
      - run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git add "coleta/${{ inputs.nome }}" && git commit -m "Baixar: ${{ inputs.nome }}" && git pull --rebase && git push
