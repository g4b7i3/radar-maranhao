# Uso pontual: baixa vários arquivos públicos (uma linha "nome url" por arquivo) e salva em coleta/.
name: Baixar varios
on:
  workflow_dispatch:
    inputs:
      lista: { description: 'Linhas "nome url" separadas por ;', required: true }
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          IFS=';' read -ra ITENS <<< "${{ inputs.lista }}"
          for it in "${ITENS[@]}"; do
            nome=$(echo "$it" | awk '{print $1}'); url=$(echo "$it" | awk '{print $2}')
            [ -n "$nome" ] && curl -sSL --max-time 90 -o "coleta/$nome" "$url" && ls -la "coleta/$nome" || echo "falhou $nome"
          done
      - run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git add coleta && git commit -m "Baixar vários" && git pull --rebase && git push
