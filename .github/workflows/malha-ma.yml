# Uso único: baixa o contorno do Maranhão (IBGE, dados públicos) para o mapa das provas.
name: Baixar contorno do MA
on: workflow_dispatch
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dados-mapa
          curl -fsSL "https://servicodados.ibge.gov.br/api/v3/malhas/estados/21?formato=application/vnd.geo%2Bjson&qualidade=intermediaria" -o dados-mapa/ma.json
          curl -fsSL "https://servicodados.ibge.gov.br/api/v1/localidades/estados/21/municipios" -o dados-mapa/municipios.json
          git config user.name g4b7i3 && git config user.email vinikautor@gmail.com
          git add dados-mapa && git commit -m "Contorno do MA (IBGE) para o mapa" && git push
