name: Transcrever narração (temporário)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  transcrever:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Whisper (português, tempo de cada palavra)
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q faster-whisper
          python - <<'P'
          import json
          from faster_whisper import WhisperModel
          m = WhisperModel('medium', device='cpu', compute_type='int8')
          segs, info = m.transcribe('narracao-tmp/voz.m4a', language='pt', word_timestamps=True, vad_filter=False, beam_size=5)
          out = []
          for s in segs:
              out.append({'ini': round(s.start, 2), 'fim': round(s.end, 2), 'texto': s.text.strip(),
                          'palavras': [{'p': w.word.strip(), 'ini': round(w.start, 2), 'fim': round(w.end, 2)} for w in s.words]})
          json.dump(out, open('narracao-tmp/transcricao.json', 'w'), ensure_ascii=False, indent=1)
          print('\n'.join(f"{s['ini']:6.2f}-{s['fim']:6.2f} {s['texto']}" for s in out))
          P
      - name: Salvar
        run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git add narracao-tmp/transcricao.json && git commit -m "Transcrição da narração (temporário)" && git pull --rebase && git push
