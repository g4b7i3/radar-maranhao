name: Voz (amostra temporária)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gerar amostras com vozes neurais em português (Piper)
        run: |
          pip install -q piper-tts
          sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p vozes
          for v in pt_BR/faber/medium pt_BR/cadu/medium pt_BR/jeff/medium pt_BR/edresson/low; do
            n=$(echo $v | tr '/' '-' | sed 's/^pt_BR-/pt_BR-/'); f="pt_BR-$(echo $v | cut -d/ -f2)-$(echo $v | cut -d/ -f3)"
            base="https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/$v/$f"
            curl -sfL "$base.onnx" -o vozes/$f.onnx && curl -sfL "$base.onnx.json" -o vozes/$f.onnx.json || { echo "sem $f"; continue; }
            curl -sfL "https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/$v/MODEL_CARD" -o voz-amostra/$f-licenca.txt || true
            python -m piper -m vozes/$f.onnx --length-scale 0.95 -f voz-amostra/$f.wav < voz-amostra/texto.txt
            ffmpeg -loglevel error -y -i voz-amostra/$f.wav -b:a 128k voz-amostra/$f.mp3 && rm voz-amostra/$f.wav
          done
          ls -la voz-amostra
      - name: Salvar
        run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git add voz-amostra && git commit -m "Amostras de voz (temporário)" && git pull --rebase && git push || echo "nada novo"
