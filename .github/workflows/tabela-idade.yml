# Uso único: baixa as tabelas públicas de idade (WMA / Alan Jones) para a calculadora "Nota por idade".
name: Baixar tabelas de idade
on: workflow_dispatch
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dados-idade
          gh api "search/repositories?q=age+grading+road+running&per_page=15" --jq '.items[] | "\(.full_name) | \(.stargazers_count) | \(.pushed_at) | \(.license.spdx_id) | \(.description)"' > dados-idade/BUSCA.txt || true
          gh api "search/repositories?q=AlanLyttonJones" --jq '.items[].full_name' >> dados-idade/BUSCA.txt || true
          gh api "users/AlanLyttonJones/repos" --jq '.[] | "\(.full_name) | \(.default_branch) | \(.license.spdx_id)"' >> dados-idade/BUSCA.txt || true
          for r in AlanLyttonJones/Age-Grade-Tables; do
            if git clone --depth 1 "https://github.com/$r" /tmp/ag 2>/dev/null; then
              (cd /tmp/ag && echo "$r" && git log -1 --format='%H %cd' && find . -type f -not -path './.git/*' | sort) > dados-idade/LISTA.txt
              find /tmp/ag -type f \( -iname '*road*' -o -iname '*licen*' -o -iname 'readme*' \) -not -path '*/.git/*' -size -3M -exec cp {} dados-idade/ \;
              break
            fi
          done
          git config user.name g4b7i3 && git config user.email vinikautor@gmail.com
          git add dados-idade && git commit -m "Tabelas de idade: busca e arquivos" && git push
