<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Radar Corridas Maranhão — corridas de rua e trail</title>
    <meta name="description" content="Agenda de corridas de rua e trail em São Luís e no Maranhão, com prazos de inscrição e fontes conferidas." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141c31" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <!-- avisa navegadores como o Samsung Internet que o site já tem modo escuro próprio (evita escurecimento forçado) -->
    <meta name="color-scheme" content="light dark" />
    <script>
      try { var t = localStorage.getItem('radar-tema'); if (t === 'dark' || t === 'light') { document.documentElement.dataset.theme = t; document.querySelector('meta[name="color-scheme"]').content = t; } } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Corridas MA" />
    <meta name="application-name" content="Corridas MA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
      <!-- Contador de visitas (Umami): sem cookies, não precisa de aviso de consentimento -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="b76ab5df-6ae1-413d-8502-e52632473f44"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
