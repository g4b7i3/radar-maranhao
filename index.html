<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Radar Pro · a rede social do corredor maranhense</title>
    <meta name="description" content="A rede social do corredor maranhense: agenda grátis de todas as corridas de rua e trail do Maranhão, resultado oficial pelo número de peito, ranking, ligas, medalhas e duelos." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Radar Corridas Maranhão" />
    <meta property="og:title" content="Radar Corridas Maranhão — agenda de corridas e Radar Pro" />
    <meta property="og:description" content="Todas as corridas de rua e trail do Maranhão num lugar só. E o Radar Pro: sua temporada com resultado oficial, nota por idade, ranking do Maranhão e 97 medalhas." />
    <meta property="og:image" content="https://radarcorridasma.com.br/img/og-pro.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141c31" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <!-- avisa navegadores como o Samsung Internet que o site já tem modo escuro próprio (evita escurecimento forçado) -->
    <!-- endereço oficial para o Google; o radarcorridas.netlify.app segue funcionando para quem instalou o app -->
    <link rel="canonical" href="https://radarcorridasma.com.br/" />
    <meta property="og:url" content="https://radarcorridasma.com.br/" />
    <meta name="google-site-verification" content="xdSZl_GKZMJt6lOxy7fJVHgSn-MzT5ufDvQVeBSmbH0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try { var t = localStorage.getItem('radar-tema'); if (t === 'dark' || t === 'light') { document.documentElement.dataset.theme = t; document.querySelector('meta[name="color-scheme"]').content = t; } } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Corridas MA" />
    <meta name="application-name" content="Corridas MA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Radar Pro (/?pro): é instalado como outro app, com a logo dourada e nome próprio
      // Radar e Radar Pro são um app só: quem instalou pelo /pro continua com o manifesto de lá
      if (/[?&](pro|atleta)\b/.test(location.search) || /^\/pro\b/.test(location.pathname)) document.querySelector('link[rel="manifest"]').href = '/pro.webmanifest';
      if (!/[?&](story|card|nota|calc)=/.test(location.search)) {
        document.querySelector('link[rel="apple-touch-icon"]').href = '/icons/pro-apple-touch-icon.png';
        document.querySelector('meta[name="apple-mobile-web-app-title"]').content = 'Radar Pro';
        document.querySelector('meta[name="application-name"]').content = 'Radar Pro';
        document.title = 'Radar Pro · Corridas MA';
      }
    </script>
      <!-- Contador de visitas (Umami): sem cookies, não precisa de aviso de consentimento -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="b76ab5df-6ae1-413d-8502-e52632473f44"></script>
  </head>
  <body>
    <div id="root"><div id="abertura" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,sans-serif;background:#f3f5f9;color:#0f1a33;text-align:center;padding:24px">
      <svg width="64" height="64" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1a2a6c"/><g fill="none" stroke="#F2B705" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 0 8-8M20 4a8 8 0 0 0 8 8M28 20a8 8 0 0 0-8 8M12 28a8 8 0 0 0-8-8"/><path d="M16 9l7 7-7 7-7-7z"/></g></svg>
      <b style="font-size:20px">Radar Corridas MA</b>
      <span style="opacity:.8;font-size:15px">Carregando…</span>
      <p id="abertura-dica" style="display:none;max-width:320px;margin:8px 0 0;font-size:14px;line-height:1.4;opacity:.9">Está demorando? Se você abriu pelo Instagram, toque nos três pontinhos (⋯) lá em cima e escolha <b>Abrir no navegador</b>.</p>
    </div></div>
    <script>
      // sem tela branca: mostra a abertura do Radar Pro e, se a internet estiver lenta, uma dica
      if (!/[?&](story|card|nota|calc)=/.test(location.search)) { var ab = document.querySelector('#abertura b'); if (ab) ab.textContent = 'Radar Pro'; var a0 = document.getElementById('abertura'); if (a0) { a0.style.background = '#0A1240'; a0.style.color = '#fff'; } }
      setTimeout(function () { var d = document.getElementById('abertura-dica'); if (d) d.style.display = 'block'; }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
