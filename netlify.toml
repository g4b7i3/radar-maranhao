# Configuração do Netlify — não precisa mexer em nada no painel.
[build]
  command = "npm run build"
  publish = "dist"
  # Mudança só na pasta coleta/ (dados brutos da coleta automática) não republica o site.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)coleta'"

[build.environment]
  NODE_VERSION = "22"

# A agenda é lida sempre fresca, para a atualização diária aparecer na hora.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

# Calendário: o iPhone abre "Adicionar ao Calendário" e a agenda assinada busca a versão nova.
[[headers]]
  for = "/calendario/*"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Cache-Control = "public, max-age=1800"

# O service worker e o manifesto nunca ficam presos em cache, para o app se atualizar sozinho.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Links do Radar Pro com ?pro=… (convite de duelo) e perfil público ?atleta=… usam a página do Pro,
# para a prévia do link (WhatsApp, Instagram) mostrar a temporada. O endereço no navegador não muda.
[[redirects]]
  from = "/"
  to = "/pro/index.html"
  status = 200
  query = {pro = ":pro"}

[[redirects]]
  from = "/"
  to = "/pro/index.html"
  status = 200
  query = {atleta = ":atleta"}

[[headers]]
  for = "/pro.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
