# Configuração do Netlify — não precisa mexer em nada no painel.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# A agenda é lida sempre fresca, para a atualização diária aparecer na hora.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

# O service worker e o manifesto nunca ficam presos em cache, para o app se atualizar sozinho.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
